# Reverse proxy for the OCR service on a server managed by aaPanel.
#
# WHY A SEPARATE FILE
# aaPanel owns nginx. It generates each site's config at
#   /www/server/panel/vhost/nginx/<domain>.conf
# and rewrites it whenever you change the site in the panel, so the standard
# deploy/nginx.conf (which assumes /etc/nginx/sites-available) does not apply
# and hand-edits to the generated file can be overwritten.
#
# HOW TO INSTALL
# Preferred - through the panel, so aaPanel keeps ownership:
#   aaPanel -> Website -> <your domain> -> Config File
#   paste the location blocks below INSIDE the existing `server { ... }`,
#   above any `location ~ \.php$` block, then Save. aaPanel reloads nginx.
#
# Alternative - a file aaPanel includes but does not regenerate:
#   sudo mkdir -p /www/server/panel/vhost/nginx/well-known
#   sudo cp deploy/nginx-aapanel.conf \
#           /www/server/panel/vhost/nginx/well-known/ocr.conf
#   then add this one line inside the site's server block via the panel:
#       include /www/server/panel/vhost/nginx/well-known/ocr.conf;
#   sudo nginx -t && sudo nginx -s reload
#
# SCOPE
# Only the service's own routes are proxied, so an existing PHP application on
# the same domain keeps working. If the domain is dedicated to this API, you
# can replace the four blocks with a single `location / { ... }` using the same
# proxy directives.
#
# TLS is handled by aaPanel (Website -> SSL -> Let's Encrypt). Issue the
# certificate there rather than running certbot by hand, or the panel and
# certbot will fight over the config.

# --- upstream ---------------------------------------------------------------
# Must match PORT in .env and ExecStart in the systemd unit. If 8000 is already
# taken on this server, change it in all three places.
upstream ocr_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 8;
}

# --- rate limiting ----------------------------------------------------------
# Edge limiting, in front of the application's own limiter. Declare these in
# the http{} context: on aaPanel that is /www/server/nginx/conf/nginx.conf, or
# a file included from it. If you cannot reach http{}, delete the two
# `limit_req`/`limit_conn` lines below and rely on the application's limiter.
#
#   limit_req_zone  $binary_remote_addr zone=ocr_limit:10m rate=30r/m;
#   limit_conn_zone $binary_remote_addr zone=ocr_conn:10m;

# --- the OCR endpoint -------------------------------------------------------
location /api/v1/ocr {
    limit_req zone=ocr_limit burst=10 nodelay;
    limit_conn ocr_conn 4;

    proxy_pass http://ocr_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Must exceed OCR_TIMEOUT_SECONDS (45 by default) or nginx cuts the
    # connection while the service is still working.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # At least MAX_UPLOAD_SIZE plus multipart overhead.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Stream the upload through instead of spooling it to disk: one less copy
    # of a document image on the filesystem.
    proxy_request_buffering off;
    proxy_buffering off;
}

location = /api/v1/version {
    proxy_pass http://ocr_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- probes -----------------------------------------------------------------
location = /health {
    proxy_pass http://ocr_backend;
    proxy_set_header Host $host;
    access_log off;
}

location = /ready {
    proxy_pass http://ocr_backend;
    proxy_set_header Host $host;
    access_log off;
}
