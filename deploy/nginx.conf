# Nginx reverse proxy for the document OCR service.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/passport-ocr
#   sudo ln -s /etc/nginx/sites-available/passport-ocr /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace ocr.example.com with your domain before enabling.
#
# The TLS block below is what certbot writes for you. Deploy this file with
# only the :80 server present, run certbot, and it will fill in the rest.

# Rate limiting at the edge, in front of the application's own limiter. This
# one protects the process from ever seeing the load.
limit_req_zone $binary_remote_addr zone=ocr_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ocr_conn:10m;

upstream ocr_backend {
    # Must match ExecStart in the systemd unit.
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ocr.example.com;

    # Let certbot answer its challenge over plain HTTP...
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ...and send everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ocr.example.com;

    # --- TLS ---------------------------------------------------------------
    # certbot fills these in; the paths are what it uses by default.
    ssl_certificate     /etc/letsencrypt/live/ocr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Do not advertise the version to the world.
    server_tokens off;

    # --- uploads ------------------------------------------------------------
    # Must be at least MAX_UPLOAD_SIZE plus multipart overhead, or Nginx
    # rejects the upload before the application can return its own error.
    client_max_body_size 12m;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    # --- logging ------------------------------------------------------------
    # Document images and recognised text must never reach the access log.
    # Only the request line, status and timing are recorded.
    access_log /var/log/nginx/passport-ocr.access.log;
    error_log  /var/log/nginx/passport-ocr.error.log warn;

    # --- proxy --------------------------------------------------------------
    location /api/ {
        limit_req zone=ocr_limit burst=10 nodelay;
        limit_conn ocr_conn 4;

        proxy_pass http://ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # OCR is slow. These must exceed OCR_TIMEOUT_SECONDS or Nginx will cut
        # the connection while the application is still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Stream the upload straight through rather than spooling it to disk:
        # one less copy of a document image on the filesystem.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Probes: cheap, unauthenticated, and not rate limited.
    location = /health {
        proxy_pass http://ocr_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://ocr_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nothing else is served. The API docs, if enabled, stay internal.
    location / {
        return 404;
    }
}
